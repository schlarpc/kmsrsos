[package]
name = "kmsrs-vectors"
description = "Golden wire vectors and shared test infrastructure (TEST-002)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
publish = false

# The fuzz-target bodies live in `src/targets.rs` so that a stable toolchain
# type-checks, lints and runs them; only the three-line libFuzzer shims are
# nightly-only (SEC-004, #196). That is what these dependencies are for, and it
# is why the dependency edge from kmsrs-proto back to this crate is a
# *dev*-dependency: a cycle through dev-dependencies is permitted, and nothing
# that ships names this crate at all.
[dependencies]
kmsrs-proto = { workspace = true, features = ["testing"] }
kmsrs-crypto.workspace = true
# The HTTP request parser (SEC-013, #306) lives in kmsrs-server, because the web
# UI is folded into that crate (ARCH-001, #1). The edge back the other way is a
# *dev*-dependency, which is a cycle cargo permits and which nothing that ships
# can see — the same shape as the kmsrs-proto edge above.
kmsrs-server.workspace = true
zerocopy = { workspace = true, features = ["derive"] }

[dev-dependencies]

[lints]
workspace = true
