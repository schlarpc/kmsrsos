# Windows host builds a generated ePID may claim (`DB-011`, #135).
#
# CURATED INPUT — not extracted. This is the one table in the database that no
# Microsoft artifact carries: `PlatformId` appears in no published document and
# is not in `pkeyconfig`. It was established by the research in
# `docs/research-findings.md`, corroborated against two genuine ePIDs captured
# from real machines, and it is committed here so that `kmsrs-dbgen` stamps it
# with that provenance rather than it appearing in the generated file from
# nowhere.
#
# `release_date` is the lower bound for the randomised activation date in an
# ePID (`ID-007`, #112), so it is required for every build that may be used for
# one and omitted where the research did not establish it. `kmsrs-db`'s build
# asserts that pairing rather than trusting it.
#
# `ndr64` is not independent: build 9200 was the first to speak NDR64. It is a
# column rather than a computed predicate so that the coupling is data a
# reviewer can check against the research, and `ID-010` (#115) makes an
# inconsistent pairing unrepresentable in the type system.

