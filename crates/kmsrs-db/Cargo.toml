[package]
name = "kmsrs-db"
description = "Compile-time product database: CSVLKs, GVLKs, KMS IDs, host builds (ARCH-001)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[dependencies]

[build-dependencies]
# Build-only, so it never reaches the shipped binary. `build.rs` turns the
# committed data file into static tables (DB-003, #127).
toml.workspace = true

[dev-dependencies]
# `tests/data_integrity.rs` (TEST-007, #228) reads the committed products.toml
# to check its provenance. The build script already depends on `toml`; this is
# the same parse, asked a different question.
toml.workspace = true

[lints]
workspace = true
