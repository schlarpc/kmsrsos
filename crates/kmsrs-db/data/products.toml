# KMS client setup keys (`DB-013`, #137), from Microsoft's own
# published tables. These never appear on the wire — a KMS host is not
# sent a key and could not check one — so nothing in activation reads
# this. It exists because the operator reading /instructions needs the
# key for their edition, and the alternative is a forum post.
#
# Deliberately not joined to the product table. Microsoft's tables name
# an edition the way a person would and pkeyconfig names it by
# `EditionId`; there is no identifier in common, so a join would be a
# name mapping somebody authored, and a wrong row would pair a real
# edition with a real key belonging to a different one — which is
# exactly the class of error `DB-009` (#133) is about.
#
# `release` is not decoration. An edition name is not unique on the
# page: three rows read `Windows Server Datacenter` with three
# different keys, one per release tab, and this is the only field that
# tells them apart.
