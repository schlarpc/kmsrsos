[package]
name = "kmsrs-server"
description = "KMS host emulator: platform layer, listeners, HTTP responder, wiring (ARCH-001)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "kmsrsos"
path = "src/main.rs"

[dependencies]
kmsrs-proto.workspace = true
kmsrs-policy.workspace = true
kmsrs-db.workspace = true
kmsrs-crypto.workspace = true
getrandom = { workspace = true, features = ["std"] }
serde.workspace = true
toml.workspace = true
mio.workspace = true

# OS-015 (#298), PKG-013 (#250): the two dependencies that are target-gated, and
# in both cases the reason is that they do not exist on the third target rather
# than that we do not want them.
#
# `ctrlc` picks its implementation with `#[cfg(unix)]` and `#[cfg(windows)]`;
# Hermit is neither, so the module is simply absent and the crate does not
# compile there. Hermit has no signals to handle in the first place
# (docs/research-findings.md §R2), so nothing is lost.
#
# `socket2` is the same shape: its `sys` module is `#[cfg(unix)]`/`#[cfg(windows)]`
# and nothing else, so on Hermit the build fails with `E0583` before any of our
# code is reached. Both options it is used for are already known to be
# unreachable or a no-op there (`OS-010`, #261), so the Hermit branch of
# `net::listener` binds with `std::net::TcpListener` instead — see
# `platform::BACKLOG_IS_EXPLICIT` for the one property that is thereby lost.
#
# This is the exception to "never a cfg on an item": every other platform
# difference is a `const bool` in src/platform.rs whose branches all compile
# everywhere. No runtime bool can select around a crate that will not build.
[target.'cfg(not(target_os = "hermit"))'.dependencies]
ctrlc.workspace = true
socket2.workspace = true

[dev-dependencies]
# Deterministic entropy for the host-state tests. Enabling `testing` here does
# not enable it for the binary: under resolver 3 a dev-dependency's features do
# not propagate to the normal dependency graph (ARCH-003, #3).
kmsrs-proto = { workspace = true, features = ["testing"] }
# The wire tests build RPC PDUs by hand, the way a client would.
zerocopy = { workspace = true, features = ["derive"] }
# Used only by `tests/workspace_invariants.rs`, which reads the workspace's own
# manifests and lockfile to check the structural invariants of ARCH-001,
# ARCH-008, ARCH-016 and SEC-001.
toml.workspace = true
# `tests/audited_c_defects.rs` (SEC-002, #194) drives the committed responses
# through the client's decoder, because half the audited defects are in
# vlmcsd's *client*. A dev-dependency, so the cycle with kmsrs-client — which
# depends on this crate — is one cargo permits and one nothing shipped can see.
kmsrs-vectors.workspace = true
kmsrs-client = { path = "../kmsrs-client" }

[lints]
workspace = true
