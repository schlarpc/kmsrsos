[package]
name = "kmsrs-server"
description = "KMS host emulator: platform layer, listeners, HTTP responder, wiring (ARCH-001)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[[bin]]
name = "kmsrsos"
path = "src/main.rs"

[dependencies]
kmsrs-proto.workspace = true
kmsrs-policy.workspace = true
kmsrs-db.workspace = true
kmsrs-crypto.workspace = true
getrandom = { workspace = true, features = ["std"] }
serde.workspace = true
toml.workspace = true
tokio.workspace = true

# `ctrlc` and `socket2` both select their implementation with `#[cfg(unix)]`
# and `#[cfg(windows)]`. They used to be target-gated here, because Hermit was
# neither and the modules were simply absent — the one documented exception to
# "never a cfg on an item" (`OS-015`, #298; `PKG-013`, #250), since no runtime
# bool can select around a crate that will not build. `OS-018` (#334) removed
# that target, so they are ordinary dependencies and the exception is gone.
ctrlc.workspace = true
socket2.workspace = true

# `SEC-005` (#197): the Linux sandbox, and the one place the exception above
# comes back.
#
# Landlock and seccomp are Linux kernel interfaces. Neither crate builds
# anywhere else — not "does nothing there", does not compile — so no runtime
# `bool` can select around them, which is exactly the argument that target-gated
# `ctrlc` while Hermit existed.
#
# What that costs is contained on purpose: everything in `src/sandbox.rs` above
# these two calls compiles on every target, and `SANDBOX_IS_AVAILABLE` is an
# ordinary `const bool` whose branches are both compiled and tested everywhere.
# The `cfg` reaches two functions, not a module.
[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true
seccompiler.workspace = true
rustix = { workspace = true, features = ["thread"] }

[dev-dependencies]
# `test-util` is what provides `#[tokio::test(start_paused = true)]` and
# `time::advance`, which is how a deadline test drives a deadline now that
# deadlines are tokio's (`OS-024`, #340). Dev-only on purpose: under resolver 3
# a dev-dependency's features do not reach the binary, so the shipped server
# cannot have its clock paused by anything.
tokio = { workspace = true, features = ["test-util"] }
# Deterministic entropy for the host-state tests. Enabling `testing` here does
# not enable it for the binary: under resolver 3 a dev-dependency's features do
# not propagate to the normal dependency graph (ARCH-003, #3).
kmsrs-proto = { workspace = true, features = ["testing"] }
# The wire tests build RPC PDUs by hand, the way a client would.
zerocopy = { workspace = true, features = ["derive"] }
# Used only by `tests/workspace_invariants.rs`, which reads the workspace's own
# manifests and lockfile to check the structural invariants of ARCH-001,
# ARCH-008, ARCH-016 and SEC-001.
toml.workspace = true
# `tests/audited_c_defects.rs` (SEC-002, #194) drives the committed responses
# through the client's decoder, because half the audited defects are in
# vlmcsd's *client*. A dev-dependency, so the cycle with kmsrs-client — which
# depends on this crate — is one cargo permits and one nothing shipped can see.
kmsrs-vectors.workspace = true
kmsrs-client = { path = "../kmsrs-client" }

[lints]
workspace = true
