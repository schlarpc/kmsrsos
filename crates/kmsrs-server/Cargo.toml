[package]
name = "kmsrs-server"
description = "KMS host emulator: platform layer, listeners, HTTP responder, wiring (ARCH-001)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

# `PKG-017` (#368): the executable is `kmsrs-server`, not `kmsrsos`.
#
# `kmsrsos` is the project, and the bare-metal image it produces. Giving the
# server executable the project's name made three different things share one
# word — the image, the repository, and this binary — and the one it fitted
# worst was this one, which is a plain Linux/Windows service that has nothing to
# do with an OS. `kmsrs-os` is pid 1 on the bare-metal target and `kmsrs-client`
# is the client; this is the only one that did not say what it was.
[[bin]]
name = "kmsrs-server"
path = "src/main.rs"

[dependencies]
kmsrs-proto.workspace = true
kmsrs-policy.workspace = true
kmsrs-db.workspace = true
kmsrs-crypto.workspace = true
getrandom = { workspace = true, features = ["std"] }
serde.workspace = true
toml.workspace = true
tokio.workspace = true

# `ctrlc` and `socket2` both select their implementation with `#[cfg(unix)]`
# and `#[cfg(windows)]`. They used to be target-gated here, because Hermit was
# neither and the modules were simply absent — the one documented exception to
# "never a cfg on an item" (`OS-015`, #298; `PKG-013`, #250), since no runtime
# bool can select around a crate that will not build. `OS-018` (#334) removed
# that target, so they are ordinary dependencies and the exception is gone.
ctrlc.workspace = true
socket2.workspace = true

# `SEC-005` (#197): the Linux sandbox, and the one place the exception above
# comes back.
#
# Landlock and seccomp are Linux kernel interfaces. Neither crate builds
# anywhere else — not "does nothing there", does not compile — so no runtime
# `bool` can select around them, which is exactly the argument that target-gated
# `ctrlc` while Hermit existed.
#
# What that costs is contained on purpose: everything in `src/sandbox.rs` above
# these two calls compiles on every target, and `SANDBOX_IS_AVAILABLE` is an
# ordinary `const bool` whose branches are both compiled and tested everywhere.
# The `cfg` reaches two functions, not a module.
# `SEC-019` (#356): the five self-applicable process mitigations. Already in
# the lockfile transitively, so naming it directly costs no new dependency —
# only the `Threading` feature, which is where `SetProcessMitigationPolicy`
# lives. This is the crate that makes the one unsafe boundary necessary; see
# the `[lints.rust]` note below.
[target.'cfg(windows)'.dependencies]
windows-sys = { workspace = true, features = [
  "Win32_System_Threading",
  # `OBS-016` (#192): RegisterEventSourceW / ReportEventW / DeregisterEventSource.
  "Win32_System_EventLog",
] }
windows-service.workspace = true

[target.'cfg(target_os = "linux")'.dependencies]
landlock.workspace = true
seccompiler.workspace = true
rustix = { workspace = true, features = ["thread"] }

[dev-dependencies]
# `test-util` is what provides `#[tokio::test(start_paused = true)]` and
# `time::advance`, which is how a deadline test drives a deadline now that
# deadlines are tokio's (`OS-024`, #340). Dev-only on purpose: under resolver 3
# a dev-dependency's features do not reach the binary, so the shipped server
# cannot have its clock paused by anything.
tokio = { workspace = true, features = ["test-util"] }
# Deterministic entropy for the host-state tests. Enabling `testing` here does
# not enable it for the binary: under resolver 3 a dev-dependency's features do
# not propagate to the normal dependency graph (ARCH-003, #3).
kmsrs-proto = { workspace = true, features = ["testing"] }
# The wire tests build RPC PDUs by hand, the way a client would.
zerocopy = { workspace = true, features = ["derive"] }
# Used only by `tests/workspace_invariants.rs`, which reads the workspace's own
# manifests and lockfile to check the structural invariants of ARCH-001,
# ARCH-008, ARCH-016 and SEC-001.
toml.workspace = true
# `tests/audited_c_defects.rs` (SEC-002, #194) drives the committed responses
# through the client's decoder, because half the audited defects are in
# vlmcsd's *client*. A dev-dependency, so the cycle with kmsrs-client — which
# depends on this crate — is one cargo permits and one nothing shipped can see.
kmsrs-vectors.workspace = true
kmsrs-client = { path = "../kmsrs-client" }

# This is the ONE manifest in the tree that does not say `[lints] workspace =
# true`, and the reason is the single documented unsafe boundary (`SEC-019`,
# #356). The workspace table forbids `unsafe_code`, and `forbid` cannot be
# lifted by an inner `expect` — which is the property that makes it worth
# setting there. Here it is `deny` instead, so the boundary must name itself
# with an explicit `#[expect(unsafe_code)]` carrying a safety comment, and every
# other line in the crate is still rejected.
#
# The duplication this forces is the obvious objection, and it is answered by a
# test rather than by discipline: `server_lints_match_the_workspace` fails if
# these tables drift from `[workspace.lints]` in any way other than that one
# line.
[lints.rust]
unsafe_code = "deny"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_lossless = "deny"
cast_precision_loss = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
exit = "deny"
mem_forget = "deny"
integer_division = "deny"
integer_division_remainder_used = "deny"
module_name_repetitions = "allow"
similar_names = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"
