[package]
name = "kmsrs-proto"
description = "Sans-io KMS v4/v5/v6 payloads and DCE/RPC codec (ARCH-001)"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true

[features]
# Deterministic entropy sources for tests, fuzzing and differential runs
# (ARCH-003, #3). Never enabled by a shipped binary: under resolver 3 a
# dev-dependency turning this on does not turn it on for the binary's build.
testing = []

[dependencies]
kmsrs-crypto.workspace = true
kmsrs-db.workspace = true
zerocopy = { workspace = true, features = ["derive"] }
arrayvec.workspace = true

[dev-dependencies]
# A dev-dependency on this crate itself, so integration tests — which link
# against it as an external crate and therefore do not see `cfg(test)` — can
# reach the deterministic entropy sources. The shipped binary never enables the
# feature (ARCH-003, #3).
kmsrs-proto = { path = ".", features = ["testing"] }
hex.workspace = true
kmsrs-vectors.workspace = true
proptest.workspace = true

[lints]
workspace = true
