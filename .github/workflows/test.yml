name: Test

# `pull_request` covers every branch with an open PR; `push` is narrowed to the
# default branch so the two do not both fire on the same commit (CI-001, #305).
# Before SEC-004 (#196) that only wasted one runner; with a six-way fuzz matrix
# it wastes fourteen.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # The whole gate in one command (PKG-002, #239): build, clippy, fmt, tests,
  # coverage with a floor under the sans-io crates, the data-integrity check,
  # the feature powerset, a configured build through `mkKmsrsos`, and the
  # container image. `nix flake check` is the same command a developer runs, so
  # "it passes locally" and "it passes in CI" are the same claim.
  tests:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - run: nix build
      - run: nix flake check

  # Every target this project claims to support (TEST-012, #233).
  #
  # Nobody in either ecosystem tests on Windows at all, which is why vlmcsd has
  # `SO_REUSEADDR` and `SO_EXCLUSIVEADDRUSE` confused in its own diagnostics and
  # py-kms sets `SO_REUSEPORT` — a constant Windows does not have — at start-up.
  #
  # The Linux job above is the full gate; these are builds and tests only. What
  # they catch is a platform difference, and a platform difference shows up at
  # compile time or in a socket, not in clippy.
  platforms:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # A ceiling on the whole job, because a hung one costs a runner for six
    # hours and reports nothing. `.config/nextest.toml` terminates an individual
    # hung *test* long before this, and names it; this is the backstop for
    # everything that is not a test.
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
          - name: windows-x86_64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v7.0.0

      # --- Linux: the whole gate, through the same command a developer runs ---
      - if: runner.os == 'Linux'
        uses: DeterminateSystems/nix-installer-action@v22
      - if: runner.os == 'Linux'
        uses: DeterminateSystems/magic-nix-cache-action@v14
      - if: runner.os == 'Linux'
        run: nix build --print-build-logs
      - if: runner.os == 'Linux'
        run: nix flake check --print-build-logs

      # --- Windows: rustup and the toolchain rust-toolchain.toml pins ---
      #
      # No Nix here, so this is the same *version* arrived at differently. What
      # it catches is a platform difference, and a platform difference shows up
      # at compile time or in a socket rather than in clippy — which is why this
      # is a build and a test run rather than the whole gate.
      #
      # `kmsrs-os` is a Hermit binary and does not build for Windows, so the two
      # shipped crates are named rather than `--workspace`.
      - if: runner.os == 'Windows'
        run: rustup show active-toolchain || rustup toolchain install
      # nextest rather than `cargo test`, for one reason: it has a per-test
      # timeout and `cargo test` has none. The first Windows run of this matrix
      # sat in `cargo test` for the better part of an hour, and a job that never
      # finishes says nothing about which test is wrong.
      #
      # The prebuilt binary when it works, `cargo install` when it does not.
      # The action fails intermittently on the Windows runner image — a bash
      # startup failure its own retry does not survive — and a job that fails
      # for a reason unrelated to the change is a job people learn to re-run
      # without reading, which is how a real failure gets missed.
      - if: runner.os == 'Windows'
        id: nextest
        continue-on-error: true
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - if: runner.os == 'Windows' && steps.nextest.outcome != 'success'
        run: cargo install cargo-nextest --locked
      - if: runner.os == 'Windows'
        run: cargo build --locked --package kmsrs-server --package kmsrs-client --all-targets
      - if: runner.os == 'Windows'
        run: cargo nextest run --profile ci --locked --package kmsrs-server --package kmsrs-client

  # The bare-metal target, as a faster signal than `nix flake check`
  # (`OS-017`, #333; `TEST-012`, #233).
  #
  # This job used to build the Hermit unikernel. `OS-018` (#334) removed that
  # target and did not remove the job, so it went on asking the flake for
  # `.#hermit-kernel` — an attribute that no longer exists — and failing on
  # every commit since. Replaced rather than deleted, because the role it played
  # is still worth having: the `linux-boot`, `linux-nics` and `linux-iso-layout`
  # checks boot real VMs and take twenty minutes, and this says "the artifact
  # does not even build" in two.
  #
  # One leg per architecture since `PKG-019` (#378). Each builds its own image
  # on its own runner: `linuxIso` on a system is the image *for* that system,
  # and the flake decides which systems have one (`OS-031`, #375).
  #
  # This was x86_64 only, on the grounds that `pkgs.syslinux` is unavailable
  # elsewhere. True, and now beside the point — the arm image has no BIOS path
  # and never reaches syslinux (`OS-033`, #377).
  bare-metal:
    name: bare-metal-${{ matrix.arch }}
    runs-on: ${{ matrix.runner }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: x86_64
            runner: ubuntu-latest
            # `bzImage` is self-decompressing and is also a Linux boot image;
            # `HdrS` at 0x202 is what isolinux and GRUB's `linux` command look
            # for.
            image: bzImage
            boot-protocol: "true"
          - arch: aarch64
            runner: ubuntu-24.04-arm
            # `CONFIG_EFI_ZBOOT` (`OS-032`, #376): a compressed PE, and *only*
            # a PE. There is no arm64 boot protocol header to check for,
            # because there is no firmware on this architecture that would read
            # one.
            image: vmlinuz.efi
            boot-protocol: "false"
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Build the kernel
        run: nix build .#linux-kernel --print-build-logs --no-link

      - name: Build the bootable ISO
        run: nix build .#linuxIso --print-build-logs --out-link result-iso

      # `OS-017` (#333): the kernel is a PE/COFF executable, which is what
      # firmware loads from the ESP. A fixup phase that "helpfully" rewrote it
      # would produce something that builds and never boots on UEFI.
      - name: The kernel is also an EFI executable
        run: |
          set -euo pipefail
          kernel=$(nix build .#linux-kernel --no-link --print-out-paths)/${{ matrix.image }}
          test "$(head -c 2 "$kernel")" = "MZ" || {
            echo "no MZ at offset 0: CONFIG_EFI_STUB is not doing its job" >&2
            exit 1
          }
          if [ "${{ matrix.boot-protocol }}" = "true" ]; then
            test "$(dd if="$kernel" bs=1 skip=514 count=4 status=none)" = "HdrS" || {
              echo "no HdrS at 0x202: this is not a Linux boot image, so the \
          BIOS path has nothing isolinux can load" >&2
              exit 1
            }
          fi

  # Axiom A5, asserted against the binary rather than against the source
  # (SEC-006, #198).
  #
  # `no_shipped_crate_touches_the_filesystem` checks that no source names an
  # API that opens a file. This checks the other end: run the real binary and
  # watch every syscall it makes. A dependency that opens something, or a libc
  # that reads a configuration file behind our back, is invisible to a grep and
  # obvious here.
  no-file-access:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Build the release binaries
        run: nix build .#default --print-build-logs --out-link result

      - name: Watch every file the server opens
        run: nix develop -c ci/no-file-access.sh ./result

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strace-log
          path: strace.log
          if-no-files-found: ignore

  # Two builds of one revision are the same bytes (SEC-010, #202;
  # CFG-008, #173).
  #
  # vlmcsd bakes `date +%s` into every build, so this is not hypothetical — and
  # there the timestamp is load-bearing, being the upper bound of its randomised
  # ePID activation date, so its identity depends on when it was compiled.
  #
  # `nix build --rebuild` builds the derivation again and compares the result
  # against what is already in the store, which is the whole check in one flag.
  reproducible:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - run: nix build .#server --print-build-logs
      - run: nix build .#server --rebuild --print-build-logs

      # `PKG-016` (#366): the ISO too, and this one had never been asked.
      #
      # It was not reproducible. Two builds of one revision differed by 74
      # bytes, every one a date in the volume descriptor or a directory record
      # — `cp` stamps each staged file with the moment it ran and xorriso
      # stamps the volume with its own clock. No content differed, which is
      # exactly why nobody noticed.
      #
      # It matters more since `PKG-015` (#364) put this file behind a stable
      # download URL: an artifact somebody else can rebuild and compare needs
      # no trust in the machine that built it.
      - run: nix build .#linuxIso --print-build-logs --no-link
      - run: nix build .#linuxIso --rebuild --print-build-logs --no-link

  # Proof that the sans-io core cannot panic (ARCH-009, #9).
  #
  # Its own job for the same reason as `fuzz`: it needs the nightly that
  # -Zbuild-std requires, which nothing that ships is built with. It is fast —
  # one bare-metal build of two crates — so it is not matrixed.
  panic-freedom:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - run: nix develop .#fuzz -c ./panic-audit/audit.sh

  # A short fuzzing run on every PR (SEC-004, #196).
  #
  # Separate from `tests` for two reasons. It needs the nightly toolchain that
  # `-Zsanitizer=address` requires, which nothing that ships is built with; and
  # it is the only job here that is not deterministic, so keeping it out of
  # `nix flake check` means a flake in the fuzzer can never be mistaken for a
  # broken build.
  #
  # Sixty seconds per target is a smoke test, not a campaign: it catches a
  # target that no longer compiles, a seed set that no longer parses, and the
  # shallow crashes. Finding the deep ones is what a long local run is for —
  # see crates/kmsrs-vectors/src/targets.rs.
  fuzz:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - rpc_pdu
          - connection
          - kms_payload
          - decrypt_unpad
          - epid
          - response
          - http_request
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      # The working corpus is seeded from the committed set rather than being
      # the committed set: libFuzzer writes back into the first directory it is
      # given, and `fuzz/seeds/` is asserted byte-exact by a test.
      - run: mkdir -p fuzz/corpus/${{ matrix.target }}
      - name: Fuzz ${{ matrix.target }}
        run: |
          nix develop .#fuzz -c cargo fuzz run ${{ matrix.target }} \
            fuzz/corpus/${{ matrix.target }} fuzz/seeds/${{ matrix.target }} \
            -- -max_total_time=60 -print_final_stats=1
      # A crash is written to fuzz/artifacts/ and is the only thing worth
      # keeping from a run: it is the reproducer.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore

  # --- The bootable artifacts, on every run -------------------------------
  #
  # `PKG-015` (#364). Built with `nix build`, the same command the release
  # workflow uses and the same one `nix flake check` gates on. There is no
  # snapshot-only build path for the same reason there is no release-only one:
  # an artifact built differently from the thing that was tested is an artifact
  # nothing has tested.
  #
  # Both are cross-compiled from Linux and neither is built on the platform it
  # runs on. That is deliberate for the Windows binaries — `release.yml` says
  # why, and it is the same reason: the artifact is a pure function of the flake
  # inputs, and building it on a Windows runner would make it a function of the
  # runner image as well. The `windows-x86_64` leg of `platforms` above is a
  # *test* run on a real Windows machine, which is a different question.
  #
  # This runs on pull requests too. A workflow artifact on a pull request is how
  # somebody boots the change before it merges, which is worth rather more here
  # than usual: the ISO's whole surface is "does it boot", and `linux-boot` only
  # answers that for QEMU.
  snapshot:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Build the bootable ISO and the Windows binaries
        run: |
          set -euo pipefail
          mkdir -p out
          nix build .#linuxIso --print-build-logs --out-link result-iso
          nix build .#windows  --print-build-logs --out-link result-windows

          # The same names the release uses, so an operator who has downloaded
          # both is not comparing `kmsrsos-x86_64.iso` against something else.
          cp result-iso out/kmsrsos-x86_64.iso
          cp result-windows/bin/*.exe out/

      # Produced here, on the machine that built the artifacts, rather than in
      # the job that publishes them — the same reasoning as `release.yml`
      # (`SEC-010`, #202).
      - name: Checksums
        run: cd out && sha256sum * > SHA256SUMS

      - uses: actions/upload-artifact@v4
        with:
          name: snapshot-x86_64
          path: out/
          if-no-files-found: error

  # --- The `latest` pointer, moved only when everything is green ----------
  #
  # `PKG-015` (#364): a rolling prerelease at the tag `latest`, so there is one
  # stable URL for the newest build of `main` that passed the whole gate.
  #
  # # Why `needs` lists every job
  #
  # "All green" has to mean *all*, and the only way to say that in Actions is to
  # name them. A job added later and not added here would leave this moving the
  # pointer on a build that job had failed — which is worse than not having a
  # pointer, because the failure is silent and the artifact looks blessed.
  #
  # `the_latest_pointer_waits_for_every_job` in `packaging_invariants.rs` is
  # what stops that: it reads this file, and fails if any job is missing from
  # the list below.
  #
  # # Why this is not a release
  #
  # `make_latest` is never set, so GitHub's "Latest" badge stays on the newest
  # real tag. The release is marked prerelease, its notes say what it is, and it
  # carries no SBOM and no `.deb`, `.rpm` or container image — those are things
  # a tag produces (`PKG-003`, #240) and this is not a tag.
  #
  # It *is* signed. An unverifiable bootable image that people download is worse
  # than one they can check, the machinery is already here, and keyless signing
  # records the workflow path in the certificate — so the signature itself is
  # what distinguishes a snapshot from a release, rather than a promise in the
  # notes.
  latest:
    needs:
      - tests
      - platforms
      - bare-metal
      - no-file-access
      - reproducible
      - panic-freedom
      - fuzz
      - snapshot
    # Never from a pull request: a fork's branch must not be able to move a
    # pointer people download from.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      # Keyless signing: the token is the identity and there is no private key
      # anywhere (`SEC-013`, #205).
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/download-artifact@v4
        with:
          name: snapshot-x86_64
          path: release

      # The checksums came from the machine that built the artifacts. Verifying
      # them here proves the round trip through the artifact store did not
      # change anything, which is the only thing this job could break.
      - name: Verify what was uploaded
        run: cd release && sha256sum -c SHA256SUMS

      - uses: sigstore/cosign-installer@v3.7.0
      - name: Sign the checksums
        run: |
          cd release
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            SHA256SUMS

      - name: Move the pointer
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          cat > notes.md <<'NOTES'
          **This is not a release.** It is the newest commit on `main` that
          passed the whole gate, rebuilt on every push, and the tag moves.

          Use it to try something before it is tagged. For anything you intend
          to keep running, take a real release: this one is replaced without
          warning, has no version number to report in a bug, and carries no
          SBOM, `.deb`, `.rpm` or container image — those are what a tag
          produces.

          | | |
          |---|---|
          | `kmsrsos-x86_64.iso` | the bootable image; upload it, attach it, boot it |
          | `kmsrs-server.exe`, `kmsrs-client.exe` | cross-compiled against a pinned MSVC CRT and SDK |
          | `SHA256SUMS`, `.sig`, `.pem` | one keyless cosign signature over the checksums |

          Verifying it is the same procedure as a release, with one difference —
          the certificate identity names this workflow rather than the release
          one, which is how a signature tells you which channel it came from:

          ```sh
          cosign verify-blob SHA256SUMS \
            --signature SHA256SUMS.sig --certificate SHA256SUMS.pem \
            --certificate-identity-regexp 'https://github.com/schlarpc/kmsrsos/.github/workflows/test.yml@.*' \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com
          sha256sum -c SHA256SUMS
          ```
          NOTES
          printf '\nBuilt from `%s`.\n' "$GITHUB_SHA" >> notes.md

          # Deleted and recreated rather than edited, so the tag moves to this
          # commit and no asset from the previous snapshot survives. `|| true`
          # because the very first run has nothing to delete.
          gh release delete latest --cleanup-tag --yes || true
          gh release create latest \
            --target "$GITHUB_SHA" \
            --title "Latest build of main" \
            --notes-file notes.md \
            --prerelease \
            release/*
