name: Test

# `pull_request` covers every branch with an open PR; `push` is narrowed to the
# default branch so the two do not both fire on the same commit (CI-001, #305).
# Before SEC-004 (#196) that only wasted one runner; with a six-way fuzz matrix
# it wastes fourteen.
on:
  pull_request:
  push:
    branches: [main]

jobs:
  # The whole gate in one command (PKG-002, #239): build, clippy, fmt, tests,
  # coverage with a floor under the sans-io crates, the data-integrity check,
  # the feature powerset, a configured build through `mkKmsrsos`, and the
  # container image. `nix flake check` is the same command a developer runs, so
  # "it passes locally" and "it passes in CI" are the same claim.
  tests:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - run: nix build
      - run: nix flake check

  # Every target this project claims to support (TEST-012, #233).
  #
  # Nobody in either ecosystem tests on Windows at all, which is why vlmcsd has
  # `SO_REUSEADDR` and `SO_EXCLUSIVEADDRUSE` confused in its own diagnostics and
  # py-kms sets `SO_REUSEPORT` — a constant Windows does not have — at start-up.
  #
  # The Linux job above is the full gate; these are builds and tests only. What
  # they catch is a platform difference, and a platform difference shows up at
  # compile time or in a socket, not in clippy.
  platforms:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    # A ceiling on the whole job, because a hung one costs a runner for six
    # hours and reports nothing. `.config/nextest.toml` terminates an individual
    # hung *test* long before this, and names it; this is the backstop for
    # everything that is not a test.
    timeout-minutes: 45
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-aarch64
            runner: ubuntu-24.04-arm
          - name: windows-x86_64
            runner: windows-latest
    steps:
      - uses: actions/checkout@v7.0.0

      # --- Linux: the whole gate, through the same command a developer runs ---
      - if: runner.os == 'Linux'
        uses: DeterminateSystems/nix-installer-action@v22
      - if: runner.os == 'Linux'
        uses: DeterminateSystems/magic-nix-cache-action@v14
      - if: runner.os == 'Linux'
        run: nix build --print-build-logs
      - if: runner.os == 'Linux'
        run: nix flake check --print-build-logs

      # --- Windows: rustup and the toolchain rust-toolchain.toml pins ---
      #
      # No Nix here, so this is the same *version* arrived at differently. What
      # it catches is a platform difference, and a platform difference shows up
      # at compile time or in a socket rather than in clippy — which is why this
      # is a build and a test run rather than the whole gate.
      #
      # `kmsrs-os` is a Hermit binary and does not build for Windows, so the two
      # shipped crates are named rather than `--workspace`.
      - if: runner.os == 'Windows'
        run: rustup show active-toolchain || rustup toolchain install
      # nextest rather than `cargo test`, for one reason: it has a per-test
      # timeout and `cargo test` has none. The first Windows run of this matrix
      # sat in `cargo test` for the better part of an hour, and a job that never
      # finishes says nothing about which test is wrong.
      #
      # The prebuilt binary when it works, `cargo install` when it does not.
      # The action fails intermittently on the Windows runner image — a bash
      # startup failure its own retry does not survive — and a job that fails
      # for a reason unrelated to the change is a job people learn to re-run
      # without reading, which is how a real failure gets missed.
      - if: runner.os == 'Windows'
        id: nextest
        continue-on-error: true
        uses: taiki-e/install-action@v2
        with:
          tool: cargo-nextest
      - if: runner.os == 'Windows' && steps.nextest.outcome != 'success'
        run: cargo install cargo-nextest --locked
      - if: runner.os == 'Windows'
        run: cargo build --locked --package kmsrs-server --package kmsrs-client --all-targets
      - if: runner.os == 'Windows'
        run: cargo nextest run --profile ci --locked --package kmsrs-server --package kmsrs-client

  # The fourth target of the platform matrix (TEST-012, #233; PKG-013, #250).
  #
  # Its own job rather than a matrix leg, because it is not the same command
  # with a different runner: it is a cross-build against a Tier 3 `rust-std` and
  # a kernel that is itself compiled from source by a second, nightly toolchain.
  # The one thing it has in common with the matrix is what it catches, which is
  # a platform difference that appears at compile time — `socket2` not existing
  # on Hermit was found exactly this way.
  #
  # There is nothing to run here: the artefact is an `ELFOSABI_STANDALONE` image
  # for a machine with no operating system under it, so a runner cannot execute
  # it and `doCheck` is off. Booting it belongs with `OS-001` (#252).
  hermit:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Build the Hermit kernel
        run: nix build .#hermit-kernel --print-build-logs --no-link

      - name: Build the unikernel application
        run: nix build .#hermit --print-build-logs --out-link result-hermit

      # The loader identifies a Hermit application by its OS/ABI byte, and a
      # fixup phase that "helpfully" rewrote the ELF would produce something
      # that builds, installs and never boots.
      - name: The image is a Hermit image
        run: |
          osabi=$(od -An -t x1 -j 7 -N 1 result-hermit/bin/kmsrsos-hermit | tr -d ' ')
          test "$osabi" = "ff" || {
            echo "OS/ABI is 0x$osabi, expected 0xff (ELFOSABI_STANDALONE)" >&2
            exit 1
          }

  # Axiom A5, asserted against the binary rather than against the source
  # (SEC-006, #198).
  #
  # `no_shipped_crate_touches_the_filesystem` checks that no source names an
  # API that opens a file. This checks the other end: run the real binary and
  # watch every syscall it makes. A dependency that opens something, or a libc
  # that reads a configuration file behind our back, is invisible to a grep and
  # obvious here.
  no-file-access:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14

      - name: Build the release binaries
        run: nix build .#default --print-build-logs --out-link result

      - name: Watch every file the server opens
        run: nix develop -c ci/no-file-access.sh ./result

      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: strace-log
          path: strace.log
          if-no-files-found: ignore

  # Two builds of one revision are the same bytes (SEC-010, #202;
  # CFG-008, #173).
  #
  # vlmcsd bakes `date +%s` into every build, so this is not hypothetical — and
  # there the timestamp is load-bearing, being the upper bound of its randomised
  # ePID activation date, so its identity depends on when it was compiled.
  #
  # `nix build --rebuild` builds the derivation again and compares the result
  # against what is already in the store, which is the whole check in one flag.
  reproducible:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - run: nix build .#server --print-build-logs
      - run: nix build .#server --rebuild --print-build-logs

  # Proof that the sans-io core cannot panic (ARCH-009, #9).
  #
  # Its own job for the same reason as `fuzz`: it needs the nightly that
  # -Zbuild-std requires, which nothing that ships is built with. It is fast —
  # one bare-metal build of two crates — so it is not matrixed.
  panic-freedom:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      - run: nix develop .#fuzz -c ./panic-audit/audit.sh

  # A short fuzzing run on every PR (SEC-004, #196).
  #
  # Separate from `tests` for two reasons. It needs the nightly toolchain that
  # `-Zsanitizer=address` requires, which nothing that ships is built with; and
  # it is the only job here that is not deterministic, so keeping it out of
  # `nix flake check` means a flake in the fuzzer can never be mistaken for a
  # broken build.
  #
  # Sixty seconds per target is a smoke test, not a campaign: it catches a
  # target that no longer compiles, a seed set that no longer parses, and the
  # shallow crashes. Finding the deep ones is what a long local run is for —
  # see crates/kmsrs-vectors/src/targets.rs.
  fuzz:
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        target:
          - rpc_pdu
          - connection
          - kms_payload
          - decrypt_unpad
          - epid
          - response
          - http_request
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14
      # The working corpus is seeded from the committed set rather than being
      # the committed set: libFuzzer writes back into the first directory it is
      # given, and `fuzz/seeds/` is asserted byte-exact by a test.
      - run: mkdir -p fuzz/corpus/${{ matrix.target }}
      - name: Fuzz ${{ matrix.target }}
        run: |
          nix develop .#fuzz -c cargo fuzz run ${{ matrix.target }} \
            fuzz/corpus/${{ matrix.target }} fuzz/seeds/${{ matrix.target }} \
            -- -max_total_time=60 -print_final_stats=1
      # A crash is written to fuzz/artifacts/ and is the only thing worth
      # keeping from a run: it is the reproducer.
      - if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: fuzz-artifacts-${{ matrix.target }}
          path: fuzz/artifacts/
          if-no-files-found: ignore
