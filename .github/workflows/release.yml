# Everything a tag produces (PKG-003, #240; PKG-009, #246; SEC-010, #202).
#
# Every artifact here is built by `nix build`, which is the same command a
# developer runs and the same one `nix flake check` gates on. There is no
# release-only build path, and that is the point: a release built differently
# from the thing that was tested is a release nobody tested.
#
# What a tag produces:
#
#   * Linux binaries for x86_64 and aarch64, statically linked against musl
#   * `.deb` and `.rpm` for both, carrying the hardened systemd unit
#   * the container image, to GHCR, multi-arch
#   * Windows `.exe`s for x86_64 and ARM64, cross-compiled (PKG-020, #379)
#   * the bootable bare-metal ISO, one per architecture (OS-033, #377)
#   * an SBOM per artifact, checksums, and a cosign signature over the lot
name: Release

on:
  push:
    tags: ["v*"]
  # For rehearsing the workflow without cutting a release. Nothing is published
  # on a manual run — see the `publish` job's condition.
  workflow_dispatch:

permissions:
  contents: read

jobs:
  artifacts:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: x86_64-linux
            arch: x86_64
            runner: ubuntu-latest
          # `PKG-019` (#378): the arm ISO is built on the leg that is already
          # aarch64, and its checks run there too — same-architecture TCG
          # rather than cross-TCG on an x86 runner, which is also the faster
          # place to boot a guest.
          - name: aarch64-linux
            arch: aarch64
            runner: ubuntu-24.04-arm
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14

      # The gate, again, on the exact revision being released. A tag that was
      # pushed without its branch having been merged is a tag nothing has
      # checked, and that is the case worth catching.
      - run: nix flake check --print-build-logs

      - name: Build the artifacts
        run: |
          set -euo pipefail
          mkdir -p out
          nix build .#server    --print-build-logs --out-link result-server
          nix build .#client    --print-build-logs --out-link result-client
          nix build .#deb       --print-build-logs --out-link result-deb
          nix build .#rpm       --print-build-logs --out-link result-rpm
          nix build .#container --print-build-logs --out-link result-container

          cp result-server/bin/kmsrs-server "out/kmsrs-server-${{ matrix.name }}"
          cp result-client/bin/kmsrs-client "out/kmsrs-client-${{ matrix.name }}"
          cp result-deb/*.deb out/
          cp result-rpm/*.rpm out/
          cp result-container "out/kmsrsos-container-${{ matrix.name }}.tar.gz"

          # One bare-metal ISO per architecture, each built on its own leg
          # (`PKG-019`, #378).
          #
          # There is no `if` here any more, and the one that was here is worth
          # remembering: it tested the matrix name against the x86 leg, because
          # `pkgs.syslinux` is unavailable off x86 and the whole target was
          # gated by system. That reasoning is now *correct and irrelevant* —
          # the arm recipe has no BIOS path, so it never reaches syslinux
          # (`OS-033`, #377) — and the gate that remains lives in the flake,
          # where `linuxArches` decides which systems build a target at all.
          #
          # This block used to build `.#osImage` and `.#osIso` and ship
          # `kmsrsos-hermit.img`. `OS-018` (#334) removed that target and left
          # this behind, so a release would have failed on a missing flake
          # attribute — and `the_release_workflow_builds_what_the_gate_checks`
          # did not catch it, because it was asserting the same stale names.
          #
          # Shipped uncompressed: 5.3 MiB on x86_64 and 4.4 MiB on aarch64, and
          # a `.iso.gz` is one more step between an operator and a running host
          # — the whole deployment procedure is "upload it, attach it, boot it".
          nix build .#linuxIso --print-build-logs --out-link result-iso
          cp result-iso "out/kmsrsos-${{ matrix.arch }}.iso"

      # `SEC-010` (#202): the binaries are static, so "what is in this" is a
      # question the file itself has to answer. An SBOM derived from the
      # lockfile is that answer, and it is exact rather than inferred — every
      # version in it is pinned with `=` (PKG-006, #243).
      - name: Software bill of materials
        run: |
          set -euo pipefail
          # Through the dev shell: `cargo-cyclonedx` shells out to `rustc` for
          # the target triple, so it needs the toolchain on PATH, and running it
          # from the shell means flake.lock pins the version.
          nix develop -c cargo cyclonedx --format json --describe crate
          # One SBOM per crate is emitted; the two that ship are the two that
          # are attached, named after the binary rather than after the crate so
          # that a reader can match them to what they downloaded.
          cp crates/kmsrs-server/kmsrs-server.cdx.json \
             "out/sbom-kmsrs-server-${{ matrix.name }}.cdx.json"
          cp crates/kmsrs-client/kmsrs-client.cdx.json \
             "out/sbom-kmsrs-client-${{ matrix.name }}.cdx.json"
          test -s "out/sbom-kmsrs-server-${{ matrix.name }}.cdx.json"

      # Two builds of one revision are the same bytes. Checked on every pull
      # request too (SEC-010, #202; CFG-008, #173), and again here because a
      # release is the artifact the claim is actually about.
      #
      # The ISO as well as the binary since `PKG-019` (#378). `reproducible-iso`
      # already runs in the gate above on both legs; this makes the same claim
      # about the file somebody downloads, on the machine that produced it.
      - name: Prove the build is reproducible
        run: |
          set -euo pipefail
          nix build .#server   --rebuild --print-build-logs
          nix build .#linuxIso --rebuild --print-build-logs

      - name: Checksums
        run: |
          cd out
          sha256sum * > "SHA256SUMS-${{ matrix.name }}"

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ matrix.name }}
          path: out/
          if-no-files-found: error

  # One job per Windows architecture (`PKG-020`, #379). Both cross-compile from
  # the same Linux runner, so this is a matrix over a build *target* rather than
  # over a machine — unlike the Linux legs above, where each image is built on
  # its own hardware.
  windows:
    name: windows-${{ matrix.arch }}
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
    strategy:
      fail-fast: false
      matrix:
        arch: [x86_64, aarch64]
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: DeterminateSystems/nix-installer-action@v22
      - uses: DeterminateSystems/magic-nix-cache-action@v14

      # Cross-compiled from Linux, against a pinned MSVC CRT and SDK in a
      # fixed-output derivation. That is why there is no Windows runner here:
      # the artifact is a pure function of the flake inputs, and building it on
      # Windows would make it a function of the runner image as well. The same
      # holds for ARM64, and there is no ARM64 Windows runner to use anyway.
      - run: |
          nix build .#windows-${{ matrix.arch }} \
            --print-build-logs --out-link result-windows

      # Named by architecture, both of them (`PKG-020`, #379). `.#windows` used
      # to mean the x86_64 build and the artifact was a bare `kmsrs-server.exe`;
      # with two of them a name that does not say which is a name nobody can
      # act on.
      - run: |
          set -euo pipefail
          mkdir -p out
          cp result-windows/bin/kmsrs-server.exe \
             "out/kmsrs-server-windows-${{ matrix.arch }}.exe"
          cp result-windows/bin/kmsrs-client.exe \
             "out/kmsrs-client-windows-${{ matrix.arch }}.exe"
          cd out && sha256sum * > "SHA256SUMS-windows-${{ matrix.arch }}"

      - uses: actions/upload-artifact@v4
        with:
          name: artifacts-windows-${{ matrix.arch }}
          path: out/
          if-no-files-found: error

  publish:
    needs: [artifacts, windows]
    # Never on a manual run: `workflow_dispatch` exists to rehearse the build,
    # and a rehearsal that published would not be one.
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      # Keyless signing: the token *is* the identity, and there is no private
      # key anywhere — which is the only way to sign from CI without the
      # artifact this project claims to have none of (SEC-013, #205).
      id-token: write
    steps:
      - uses: actions/checkout@v7.0.0
      - uses: actions/download-artifact@v4
        with:
          path: downloaded

      - name: Gather
        run: |
          set -euo pipefail
          mkdir -p release
          find downloaded -type f -exec cp {} release/ ';'
          cd release && sha256sum -c SHA256SUMS-* && sha256sum * > SHA256SUMS

      - uses: sigstore/cosign-installer@v3.7.0

      # `SEC-010` (#202): one signature over the checksum file rather than one
      # per artifact. Verifying the file then verifies everything in it, which
      # is a smaller thing for somebody to get right — and the checksums were
      # produced on the machine that built each artifact rather than here.
      - name: Sign the checksums
        run: |
          cd release
          cosign sign-blob --yes \
            --output-signature SHA256SUMS.sig \
            --output-certificate SHA256SUMS.pem \
            SHA256SUMS

      - name: Push the container images
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          echo "$GHCR_TOKEN" | docker login ghcr.io -u "${{ github.actor }}" --password-stdin
          tag="${GITHUB_REF_NAME#v}"
          for image in release/kmsrsos-container-*.tar.gz; do
            arch="$(basename "$image" .tar.gz)"
            arch="${arch#kmsrsos-container-}"
            docker load < "$image"
            docker tag kmsrsos:latest "ghcr.io/${{ github.repository }}:${tag}-${arch}"
            docker push "ghcr.io/${{ github.repository }}:${tag}-${arch}"
          done
          docker manifest create "ghcr.io/${{ github.repository }}:${tag}" \
            "ghcr.io/${{ github.repository }}:${tag}-x86_64-linux" \
            "ghcr.io/${{ github.repository }}:${tag}-aarch64-linux"
          docker manifest push "ghcr.io/${{ github.repository }}:${tag}"

      # `PKG-012` (#249): the notes say what changed **on the wire**, in their
      # own section, because that is the half a downstream reader cannot
      # discover any other way. See docs/releasing.md.
      - uses: softprops/action-gh-release@v2
        with:
          files: release/*
          fail_on_unmatched_files: true
          generate_release_notes: true
          draft: true
