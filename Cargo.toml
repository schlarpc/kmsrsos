# Workspace root (ARCH-001, ARCH-016).
#
# One workspace, one lockfile, one pinned MSRV. The eight-crate split is
# load-bearing rather than cosmetic; see `ARCH-001` (#1) and the table in
# CLAUDE.md. The two properties the split exists to enforce are:
#
#   * `kmsrs-dbgen`'s dependencies (XML, gzip, HTTP) are unreachable from the
#     runtime binary, because nothing the binary depends on names it.
#   * `kmsrs-crypto` is the single place where axiom A8 ("reuse crates, don't
#     reimplement") is violated, so quarantining it keeps the hand-written
#     Rijndael independently auditable.

[workspace]
resolver = "3"
members = [
    "crates/kmsrs-proto",
    "crates/kmsrs-crypto",
    "crates/kmsrs-db",
    "crates/kmsrs-dbgen",
    "crates/kmsrs-policy",
    "crates/kmsrs-os",
    "crates/kmsrs-server",
    "crates/kmsrs-client",
    "crates/kmsrs-vectors",
]
# Both need a nightly toolchain the workspace is deliberately not pinned to, so
# each keeps its own (SEC-004, #196; ARCH-009, #9).
exclude = ["fuzz", "panic-audit"]

[workspace.package]
version = "0.1.0"
edition = "2024"
# Must equal `channel` in rust-toolchain.toml; CI asserts it (ARCH-016, #16).
rust-version = "1.96.1"
authors = ["Chaz Schlarp"]
license = "MIT"
repository = "https://github.com/schlarpc/kmsrsos"
readme = "README.md"

# Every dependency is pinned to an exact version (PKG-006, #243). Ranges are
# what let a rebuild of a tagged release produce different bytes.
#
# The workspace's own crates carry a version *and* a path. The path is what
# cargo builds against; the version is what stops `cargo deny check bans`
# reading a path dependency as a wildcard, and what would be required to
# publish any of them (SEC-009, #201).
[workspace.dependencies]
kmsrs-proto = { version = "=0.1.0", path = "crates/kmsrs-proto" }
kmsrs-crypto = { version = "=0.1.0", path = "crates/kmsrs-crypto" }
kmsrs-db = { version = "=0.1.0", path = "crates/kmsrs-db" }
kmsrs-dbgen = { version = "=0.1.0", path = "crates/kmsrs-dbgen" }
kmsrs-policy = { version = "=0.1.0", path = "crates/kmsrs-policy" }
kmsrs-server = { version = "=0.1.0", path = "crates/kmsrs-server" }
kmsrs-vectors = { version = "=0.1.0", path = "crates/kmsrs-vectors" }

zerocopy = { version = "=0.8.56", default-features = false }
sha2 = { version = "=0.11.0", default-features = false }
hmac = { version = "=0.13.0", default-features = false }
getrandom = { version = "=0.4.3", default-features = false }
arrayvec = { version = "=0.7.8", default-features = false }
hex = { version = "=0.4.3", default-features = false }
proptest = { version = "=1.11.0" }
toml = { version = "=1.1.4" }
# `serde` derive, for the one runtime-configuration document (CFG-002, #167).
# `deny_unknown_fields` is the whole reason a real parser is used rather than a
# hand-written one: it is what makes CFG-005 (#170) and CFG-006 (#171) free.
# Graceful shutdown on SIGINT/SIGTERM and Windows' SetConsoleCtrlHandler
# (NET-007, #157). A safe wrapper, so the forbid(unsafe_code) invariant holds
# in this crate too — the Windows service control handler is separate and
# belongs to M8.
ctrlc = { version = "=3.5.2", features = ["termination"] }
# Explicit IPV6_V6ONLY and an explicit listen backlog (NET-001, #150;
# NET-003, #152) — `std::net` exposes neither, and both are load-bearing:
# without the first, whether IPv4 works depends on a sysctl; without the
# second, the backlog is SOMAXCONN, far deeper than the pool can drain.
socket2 = { version = "=0.6.5" }
# The one readiness abstraction with first-class, unpatched Hermit support
# (ARCH-005, #5). Backends: epoll on Linux, IOCP on Windows, poll(2) on Hermit —
# where the kernel has sys_poll and sys_eventfd and no epoll at all.
# `OS-024` (#340). Features are named rather than "full": this needs sockets,
# timers, a current-thread scheduler and signals, and nothing else. `full`
# would pull in the process and filesystem drivers, and A5 says there is no
# filesystem to drive.
# `OS-021` (#337). Safe bindings to the syscalls pid 1 needs — `mount`,
# `waitpid`, `mkdir`. Every one of them would otherwise be an `unsafe` libc
# call, and axiom A1 is `forbid(unsafe_code)` with no exception since #334.
# Features are named rather than defaulted, and each is one pid-1 duty.
rustix = { version = "=1.1.4", default-features = false, features = [
  # `mount` and `process`: mount(2) and waitpid(2) (`OS-021`, #337).
  # `fs`: mkdir(2), and open(2) for the /proc and /sys reads below. The
  #   whole-workspace ban on opening anything does not apply to this crate and
  #   a narrower rule does — see `pid1_opens_nothing_but_pseudo_filesystems`.
  # `pipe`, `stdio`: pid 1 replaces its own fds 1 and 2 with a pipe it pumps
  #   out to every registered console (`OS-028`, #345).
  # `system`: reboot(2), so a hypervisor's shutdown request ends in an ACPI
  #   power-off rather than in pid 1 returning, which is a kernel panic
  #   (`OS-026`, #343).
  "std", "fs", "mount", "process", "pipe", "stdio", "system",
] }

# `OS-019` (#335): the DHCPv4 wire format. Parser and encoder only, sans-io by
# construction, which is what makes the lease state machine testable against
# captured exchanges without a socket.
#
# It depends on `hickory-proto` unconditionally, for the DNS name type option
# 119 is made of — about forty crates for a packet format. That was very nearly
# disqualifying, and stopped being so when `OS-020` (#336) turned out to need a
# real resolver anyway: the pool fallback is a *hostname*, and this machine has
# no `/etc/resolv.conf` for a libc resolver to read (axiom A5). The DNS library
# is paid for once and both issues spend it.
dhcproto = { version = "=0.15.0", default-features = false }

# `OS-020` (#336): resolving the NTP pool.
#
# `system-config` is deliberately off. That feature is what reads
# /etc/resolv.conf, and axiom A5 says there is no such file — the resolver is
# configured from DHCP option 6 instead, which is an observation about the
# network rather than configuration (`CFG-001`, #166). Turning it off also drops
# the macOS and Windows system-configuration crates, which this target has no
# use for.
hickory-resolver = { version = "=0.26.1", default-features = false, features = [
  "tokio",
] }

# `OS-019` (#335): applying a lease to an interface — address, prefix, default
# route, and bringing the link up.
#
# `netlink-packet-route` is message types only, built on `zerocopy`, which
# decision 2 already chose for this project's framing. `netlink-sys` supplies a
# blocking socket; its `tokio` feature is off because the lease is applied from
# a task that is already awaiting elsewhere, and three netlink round trips at
# lease time do not earn a second reactor registration.
netlink-packet-core = { version = "=0.9.0" }
netlink-packet-route = { version = "=0.33.0" }
netlink-sys = { version = "=0.9.0" }

tokio = { version = "=1.53.1", default-features = false, features = [
  "rt", "net", "time", "io-util", "sync", "macros", "signal",
] }
serde = { version = "=1.0.229", default-features = false, features = ["derive", "std"] }

# `kmsrs-dbgen` only. Nothing that ships may name these; the test in
# crates/kmsrs-server/tests/workspace_invariants.rs is what enforces it
# (ARCH-001, #1).
roxmltree = { version = "=0.21.1" }
base64 = { version = "=0.23.1" }
flate2 = { version = "=1.1.9" }
tar = { version = "=0.4.46" }
ureq = { version = "=3.4.0" }
cab = { version = "=0.6.0" }
serde_json = { version = "=1.0.151" }

# Workspace lint policy (ARCH-008, #8; SEC-001, #193).
#
# `unsafe_code = "forbid"` is set here rather than per-crate so that a new crate
# cannot silently opt out by forgetting the inner attribute. There is no
# exception any more: `kmsrs-os` held the only one (`OS-013`, #264) and went
# with Hermit in `OS-018` (#334), so the forbid is now genuinely workspace-wide.
[workspace.lints.rust]
unsafe_code = "forbid"
missing_docs = "warn"
missing_debug_implementations = "warn"
unreachable_pub = "warn"
rust_2018_idioms = { level = "warn", priority = -1 }

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
pedantic = { level = "warn", priority = -1 }

# The ARCH-008 deny list. These are the ways a Rust program written in a hurry
# still panics or silently truncates at runtime, which axiom A2 forbids.
arithmetic_side_effects = "deny"
cast_possible_truncation = "deny"
cast_possible_wrap = "deny"
cast_sign_loss = "deny"
cast_lossless = "deny"
cast_precision_loss = "deny"
indexing_slicing = "deny"
unwrap_used = "deny"
expect_used = "deny"
panic = "deny"
todo = "deny"
unimplemented = "deny"
unreachable = "deny"
exit = "deny"
mem_forget = "deny"
# `a / 0` and `a % 0` panic; `checked_div`/`checked_rem` do not (ID-015, #120).
integer_division = "deny"
integer_division_remainder_used = "deny"

# Pedantic lints that fight the house style more than they help. The doc
# comments in this tree are prose about a protocol, so `doc_markdown` spends its
# time demanding backticks around Microsoft, RustCrypto and Hermit.
module_name_repetitions = "allow"
similar_names = "allow"
must_use_candidate = "allow"
doc_markdown = "allow"

[profile.dev]
opt-level = 0
# Line tables rather than full DWARF. A panic backtrace still names the file
# and line, which is all a failing test is ever read for; full debug info costs
# compile time, link time and coverage-instrumentation time on every crate.
debug = "line-tables-only"

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
strip = true
# Half of the panic-freedom strategy (decision 3): the lints in the table above
# stop panics being written, `panic = "abort"` removes the unwinding machinery
# so that a panic that slips through cannot unwind across a request boundary and
# leave a half-updated CMID table behind. See `ARCH-009` (#9).
panic = "abort"

[profile.test]
opt-level = 0
debug = "line-tables-only"
