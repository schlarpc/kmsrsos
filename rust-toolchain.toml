# Single source of truth for the Rust toolchain (ARCH-016).
#
# - Nix reads this via `rust-bin.fromRustupToolchainFile` in flake.nix, so the
#   exact build is still pinned/reproducible through rust-overlay in flake.lock.
# - Non-Nix users with rustup get the identical version automatically.
#
# This version is also the MSRV: `rust-version` in the workspace manifest must
# match `channel` here, and CI checks that it does.
#
# To upgrade Rust: bump `channel` here, bump `workspace.package.rust-version` in
# Cargo.toml to match, then commit. Nix follows this file.
[toolchain]
channel = "1.96.1"
profile = "default"
components = ["rust-src", "rust-analyzer", "llvm-tools-preview"]
# Cross-compilation targets.
#
#   * `x86_64-pc-windows-msvc` — Windows, via cargo-xwin or `nix build .#windows`.
#   * `*-unknown-linux-musl`   — the static binaries the scratch container image
#     is built over (`PKG-004`, #241). Static rather than glibc because the
#     claim the image makes is that it contains two files, and a dynamically
#     linked binary drags in a libc closure that carries `getent` and `ldd`
#     among other things.
targets = [
  "x86_64-pc-windows-msvc",
  "x86_64-unknown-linux-musl",
  "aarch64-unknown-linux-musl",
]
