# Cargo configuration
# https://doc.rust-lang.org/cargo/reference/config.html

[alias]
# Useful aliases for common tasks
t = "test"
c = "check"
b = "build"
r = "run"
br = "build --release"
rr = "run --release"

# Testing shortcuts
tn = "nextest run"
tc = "llvm-cov nextest"

# Linting
lint = "clippy --all-targets"
lint-fix = "clippy --all-targets --fix --allow-dirty"

# Format check (use rustfmt for actual formatting)
fmt-check = "fmt -- --check"

[build]
# Use all available cores for parallel compilation
jobs = -1

[term]
# Show warnings during compilation (not just errors)
verbose = false
color = "auto"

# Progress bar configuration
[term.progress]
# "never" instead of "auto": some runners (CI, agent harnesses) allocate a PTY,
# so "auto" detects a terminal and floods logs with per-frame progress bars.
# Override locally with CARGO_TERM_PROGRESS_WHEN=auto for an interactive bar.
when = "never"
width = 80

# `PKG-017`: the MSVC CRT is linked statically.
#
# Without this the binary imports `VCRUNTIME140.dll`, which is the Visual C++
# redistributable and is **not** present on a clean Windows install — so the
# shipped .exe fails to start with `0xC0000135` (STATUS_DLL_NOT_FOUND) before
# it can log a single line. Found by running the cross-built binary on a real
# Windows guest (`SEC-019`, #356); nothing that only cross-compiles can catch it.
#
# The nix build sets its own `CARGO_TARGET_..._RUSTFLAGS`, which overrides this
# table rather than appending to it, so the same flag is in `flake.nix` as well
# and `windows-mitigations` reads the import table of the artifact to prove the
# two have not drifted.
[target.x86_64-pc-windows-msvc]
rustflags = ["-C", "target-feature=+crt-static"]
